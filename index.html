<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tale of the Grizzled Warrior and His Princess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment: #f3e6c8;
    --parchment-dark: #e8d5a8;
    --ink: #3a2c1a;
    --gold: #a8792f;
    --gold-bright: #c99a3f;
    --maroon: #6e1f1f;
    --forest: #2f4a34;
    --wood-dark: #4a2f18;
    --wood-mid: #6b4423;
    --wood-light: #8a5a2f;
    --table: #2c2013;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--table);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    line-height: 1.7;
    overflow-x:hidden;
  }

  /* ---------- Scroll rods (top & bottom wooden rollers, carved detail) ---------- */
  .scroll-rod{
    position: relative;
    height: 34px;
    border-radius: 3px;
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    background-size: 100% 100%, 12px 100%, 12px 100%, 100% 100%, 100% 100%;
